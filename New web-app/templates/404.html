<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono:300,500" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background-image: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/257418/andy-holmes-698828-unsplash.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            min-width: 100vw;
            font-family: "Roboto Mono", "Liberation Mono", Consolas, monospace;
            color: rgba(255,255,255,.87);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .number {
            font-size: 4rem;
            font-weight: 500;
        }

        .text {
            font-weight: 300;
        }

        .text + .text {
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div id="countUp">
        <div class="number" data-count="404">0</div>
        <div class="text">Page not found</div>
        <div class="text">This may not mean anything.</div>
        <div class="text">I'm probably working on something that has blown up.</div>
    </div>

    <script>
        $(document).ready(function() {
            let hasRun = false;

            function startCounter() {
                if (!hasRun) {
                    $(".number").each(function() {
                        let $this = $(this);
                        let countTo = $this.attr("data-count");

                        $({ countNum: 0 }).animate(
                            { countNum: countTo },
                            {
                                duration: 2000,
                                easing: "linear",
                                step: function() {
                                    $this.text(Math.floor(this.countNum));
                                },
                                complete: function() {
                                    $this.text(this.countNum);
                                }
                            }
                        );
                    });
                    hasRun = true;
                }
            }

            // Start the counter when the user scrolls to the section
            $(window).on("scroll", function() {
                let elementTop = $("#countUp").offset().top;
                let windowHeight = $(window).height();
                let scrollTop = $(window).scrollTop();

                if (scrollTop + windowHeight >= elementTop) {
                    startCounter();
                }
            });

            // Also run if it's already visible on page load
            if ($(window).scrollTop() + $(window).height() >= $("#countUp").offset().top) {
                startCounter();
            }
        });
    </script>

</body>
</html>
