<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MudraTranslate - {% block title %}{% endblock %}</title>
    <link rel="icon" href="../static/logo.png">



    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <!-- Swiper CSS -->
<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        /* Base styles */
        .dark { color-scheme: dark; }
        
        /* Content containers */
        .content-section {
            @apply py-20 px-6 md:px-12 lg:px-24;
        }
        .content-container {
            @apply max-w-6xl mx-auto;
        }
        .feature-card {
            @apply bg-gray-50 dark:bg-gray-700 p-6 rounded-xl shadow-sm;
        }
        .specs-card {
            @apply bg-gray-50 dark:bg-gray-700 p-8 rounded-xl shadow-sm;
        }
        
        /* Typography */
        .heading-1 {
            @apply text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-8;
        }
        .heading-2 {
            @apply text-2xl font-semibold text-gray-800 dark:text-gray-200 mb-4;
        }
        .heading-3 {
            @apply text-xl font-medium text-gray-800 dark:text-gray-200 mb-3;
        }
        .body-text {
            @apply text-gray-600 dark:text-gray-300;
        }
        
        /* Navigation styles */
        .nav-link {
            @apply text-gray-600 dark:text-gray-300 font-medium transition-colors;
        }
        .nav-link:hover {
            @apply text-primary-600 dark:text-primary-400;
        }
        
        /* Utility classes */
        .check-bullet {
            @apply h-5 w-5 rounded-full bg-primary-600 flex items-center justify-center;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-white dark:bg-gray-900 transition-colors duration-300">
    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm py-4 px-6 md:px-12 lg:px-24">
        <div class="flex justify-between items-center">
            <a href="/" class="flex items-center">
                <img src="../static/logo.png" alt="Logo" class="h-8">
            </a>
            <div class="hidden md:flex space-x-8">
                <a href="/" class="nav-link">Home</a>
                <a href="/yolo" class="nav-link">YOLO Detection</a>
                <a href="/llm" class="nav-link">LLM Model</a>
            </div>
            <div class="flex items-center space-x-4">
                <button id="themeToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                </button>
                <button class="md:hidden">
                    <i class="fas fa-bars text-gray-600 dark:text-gray-300 text-xl"></i>
                </button>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12 px-6 md:px-12 lg:px-24">
        <!-- Footer content -->
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Theme toggle functionality
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            // Check for saved theme preference or use system preference
            const savedTheme = localStorage.getItem('theme') || 
                            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            
            // Apply the saved theme
            if (savedTheme === 'dark') {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            
            // Toggle theme on button click
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    html.classList.toggle('dark');
                    const theme = html.classList.contains('dark') ? 'dark' : 'light';
                    localStorage.setItem('theme', theme);
                });
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
